name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/test
          EMAIL_USER: mailto:test@example.com
          EMAIL_PASS: dummy_pass
          CLOUDINARY_CLOUD_NAME: dummy_cloud
          CLOUDINARY_API_KEY: dummy_key
          CLOUDINARY_API_SECRET: dummy_secret
          JWT_SECRET: dummy_jwt_secret
          ADMIN_SECRET_CODE: dummy_admin_secret
          FRONTEND_URL: http://localhost:5173
          GEMINI_API_KEY: dummy_gemini_key
          VAPID_PUBLIC_KEY: BGTmKurT2ny65XikAcpI3xGXUQI5iW-x5Rk2F6cNkW60_EsZjCXApKnRk7Nlo9pGEJwInvlzPDqjt8mFnE26-do
          VAPID_PRIVATE_KEY: ZqnB4grZPD-lQOhTmZxDnxdlSgvODyEfCJdW047Fde8
          NODE_ENV: test
        run: |
          cd backend
          npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test
